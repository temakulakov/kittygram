volumes:
  pg_data:
  static:
  backend_static:
  media:

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend/
    env_file: .env
    environment:
      DJANGO_MEDIA_ROOT: /media
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 kittygram_backend.wsgi"
    volumes:
      - backend_static:/app/collected_static
      - media:/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend/
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static

  gateway:
    build: ./nginx/
    ports:
      - "${GATEWAY_PORT:-9000}:80"
    volumes:
      - static:/static
      - backend_static:/static_backend
      - media:/media
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
