server {
    listen 8090;
    server_name _;
    server_tokens off;
    client_max_body_size 20M;

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass http://127.0.0.1:8001;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass http://127.0.0.1:8001;
    }

    location /static_backend/ {
        alias /opt/kittygram/backend/collected_static/;
    }

    location /media/ {
        alias /opt/kittygram/media/;
    }

    location / {
        root /opt/kittygram/frontend/build;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
